<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030a14">
<title>Titan Sub Zero Weltrade AI</title>
<link rel="apple-touch-icon" href="image.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:ital,wght@0,500;0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Bazooka';
  src: local('Bazooka'), local('Impact');
}

:root {
  color-scheme: dark;
  --bg: #030a14;
  --panel: rgba(6, 18, 32, 0.82);
  --panel-border: rgba(0, 240, 255, 0.28);
  --muted: #6b8fa6;
  --text-main: #f3f9fc;

  --cyan-primary: #00f0ff;
  --cyan-bright: #80f8ff;
  --cyan-dark: #006680;
  --cyan-grad: linear-gradient(135deg, #80f8ff 0%, #00f0ff 50%, #0088aa 100%);
  --cyan-grad-subtle: linear-gradient(135deg, rgba(128, 248, 255, 0.15), rgba(0, 240, 255, 0.05));
  --cyan-glow: rgba(0, 240, 255, 0.4);

  --green: #00ff9d;
  --green-glow: rgba(0, 255, 157, 0.35);
  --red: #ff3366;
  --red-glow: rgba(255, 51, 102, 0.35);
  --amber: #ffb800;
  --amber-glow: rgba(255, 184, 0, 0.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: radial-gradient(circle at 50% -10%, #051c2c 0%, #030a14 55%), var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: 50px;
  overflow-x: hidden;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(3, 10, 20, 0.9); }
::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, var(--cyan-dark), var(--cyan-primary)); border-radius: 4px; }

/* CUSTOM TOAST NOTIFICATION BOX */
#toastContainer {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  max-width: calc(100vw - 48px);
}
.titan-toast {
  background: linear-gradient(135deg, rgba(8, 28, 46, 0.96), rgba(3, 12, 24, 0.98));
  border: 1px solid var(--cyan-primary);
  border-left: 4px solid var(--cyan-primary);
  color: #fff;
  padding: 13px 18px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 240, 255, 0.25);
  backdrop-filter: blur(14px);
  animation: toastSlideIn 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}
.titan-toast.success { border-color: var(--green); border-left-color: var(--green); }
.titan-toast.danger { border-color: var(--red); border-left-color: var(--red); }
@keyframes toastSlideIn {
  from { opacity: 0; transform: translateY(16px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ENTRANCE PANEL OVERLAY STYLES */
#entranceOverlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #030a14;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  overflow-y: auto;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#entranceOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* Entrance Hero Background using image.PNG */
.entrance-hero {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 440px;
  background:
    url('image.PNG') center top / cover no-repeat,
    radial-gradient(circle at 50% 28%, rgba(0, 240, 255, 0.28) 0%, rgba(0, 102, 128, 0.14) 38%, #030a14 78%),
    linear-gradient(180deg, #04192b 0%, #030a14 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  padding: 30px 20px;
  box-shadow: inset 0 -40px 60px #030a14;
  overflow: hidden;
}
.entrance-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 35%, transparent 15%, rgba(3, 10, 20, 0.78) 70%, #030a14 100%),
    linear-gradient(to top, #030a14 0%, rgba(3, 10, 20, 0.3) 50%, transparent 100%);
  z-index: 1;
}

.entrance-title-box {
  position: relative;
  z-index: 2;
  text-align: center;
  margin-bottom: 24px;
}
.titan-bazooka-3d {
  font-family: 'Bazooka', 'Impact', 'Arial Black', sans-serif;
  font-size: clamp(44px, 10vw, 78px);
  font-weight: 900;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, #b3fcff 25%, #00f0ff 55%, #007799 80%, #002233 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.95)) drop-shadow(0 0 35px rgba(0, 240, 255, 0.75));
  line-height: 0.9;
  transform: perspective(500px) rotateX(10deg);
}
.titan-sub-title {
  font-size: 15px;
  font-weight: 900;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  letter-spacing: 2px;
  margin-top: 8px;
}

.entrance-actions {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: 100%;
  max-width: 400px;
  background: rgba(5, 20, 30, 0.88);
  border: 1px solid rgba(0, 255, 157, 0.4);
  padding: 7px;
  border-radius: 35px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.entrance-pill-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 14px;
  border-radius: 25px;
  background: linear-gradient(180deg, #00ff9d 0%, #008850 100%);
  color: #030a14;
  font-weight: 900;
  font-size: 11px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 255, 157, 0.4);
  transition: transform 0.2s ease, filter 0.2s ease;
}
.entrance-pill-btn:hover { transform: scale(1.04); filter: brightness(1.2); }

.entrance-bottom-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 480px;
